<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday</title>
<meta name="description" content="Thiệp sinh nhật: lời chúc và lịch trình buổi tối.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --board: #fdfbfb;
    --ink: #4a3b40;
    --ink-dim: #85737a;
    --pink: #e7899b;
    --pink-deep: #c9607a;
    --pink-light: #f8c3cd;
    --pink-soft: #fde9ed;
    --line: #f2d3da;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0;
    height: 100svh;
    overflow: hidden;
    display: grid;
    place-items: center;
    padding: 16px;
    background: radial-gradient(120% 90% at 30% 10%, #f7f6f6 0%, #e9e6e7 70%, #dedadb 100%);
    color: var(--ink);
    font: 400 14.5px/1.6 'Mali', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .ph { display: inline-block; width: 1em; height: .92em; filter: drop-shadow(0 2px 2px rgba(150, 60, 85, .28)); vertical-align: -.08em; }

  /* The card is a white cake board: thick edge, soft shadow, slightly turned. */
  .board {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 380px;
    background: var(--board);
    border-radius: 6px;
    padding: 30px 22px 38px;
    text-align: center;
    transform: rotate(-1.5deg);
    box-shadow: 0 5px 0 #e4e0e1, 0 7px 0 #d9d4d6, 0 24px 50px rgba(90, 70, 80, .18);
    animation: place .9s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes place { from { opacity: 0; transform: translateY(28px) rotate(-4deg) scale(.96); } }

  /* Room above for the princess topper and around for the corner stickers. */
  .stage { position: relative; width: 100%; max-width: 416px; padding: 150px 18px 50px; }
  .princess {
    position: absolute; left: 50%; top: 0; width: 158px; margin-left: -79px; z-index: 0;
    filter: drop-shadow(0 6px 10px rgba(120, 60, 80, .25));
    animation: rise .8s cubic-bezier(.3, 1.4, .5, 1) .25s both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(40px) scale(.85); } }
  .stk {
    position: absolute; width: 104px; z-index: 3;
    filter: drop-shadow(0 4px 6px rgba(120, 60, 80, .22));
    animation: stick .55s cubic-bezier(.3, 1.6, .5, 1) both, sway 4s ease-in-out infinite;
  }
  .stk.tl { left: 0; top: 112px; --r: -11deg; animation-delay: 1s, 1.6s; }
  .stk.tr { right: 0; top: 104px; --r: 10deg; animation-delay: 1.15s, 2.2s; }
  .stk.bl { left: 0; bottom: 6px; --r: 8deg; animation-delay: 1.3s, 1.9s; }
  .stk.br { right: 0; bottom: 2px; --r: -9deg; animation-delay: 1.45s, 2.5s; }
  .stk { transform: rotate(var(--r)); }
  @keyframes stick { from { opacity: 0; transform: rotate(var(--r)) scale(.3); } }
  @keyframes sway { 50% { transform: rotate(calc(var(--r) * -0.4)) translateY(-3px); } }

  .piped {
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    color: var(--pink);
    -webkit-text-stroke: 1.5px var(--pink);
    text-shadow: 0 -1px 0 var(--pink-light), 0 1px 0 #d06d82, 0 2px 0 #c86378, 0 4px 6px rgba(160, 60, 80, .22);
  }
  h1 { margin: 0; font-size: 50px; line-height: 1; }
  h1 .w { display: inline-block; }
  h1 .w:nth-child(1) { transform: rotate(-3deg); }
  h1 .w:nth-child(2) { transform: rotate(2deg) translateY(2px); }
  h1 .ch { display: inline-block; animation: pipe .35s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes pipe { from { opacity: 0; transform: scale(.4) translateY(6px); } }
  .my { display: block; font-size: 40px; margin-top: 2px; }
  .my .ph { margin-left: .1em; animation: beat 1.4s ease-in-out 1.6s infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.22); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
  .dot {
    display: inline-block; width: 9px; height: 9px; margin: 0 10px; border-radius: 50%;
    background: var(--pink); box-shadow: inset -1px -2px 0 #c86378; vertical-align: middle;
  }

  .invite { margin: 12px 0 0; padding-bottom: 12px; border-bottom: 1px solid var(--line); font: 700 22px/1.3 'Gaegu', cursive; color: var(--pink-deep); text-wrap: balance; }

  .plan { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 7px; text-align: left; }
  .plan li { display: grid; grid-template-columns: 52px 1fr; padding-left: 38px; align-items: center; gap: 8px; }
  .plan time { font: 700 20px/1 'Gaegu', cursive; color: var(--pink-deep); }
  .plan b { display: block; font-weight: 600; font-size: 13.5px; line-height: 1.3; }
  .plan a, .plan small { display: block; font-size: 12px; line-height: 1.35; color: var(--ink-dim); text-decoration: none; }
  .plan a:hover { color: var(--pink-deep); text-decoration: underline; }
  .plan .tag { color: var(--pink-deep); font-weight: 600; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  @media (min-width: 720px) {
    .stage { max-width: 500px; padding: 168px 30px 56px; }
    .board { max-width: 440px; padding: 36px 32px 40px; }
    .princess { width: 176px; margin-left: -88px; }
    .stk { width: 124px; }
    h1 { font-size: 58px; }
    .my { font-size: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .board, .princess, .stk, h1 .ch, .my .ph { animation: none; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="g-pink" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fbc6d0"/><stop offset=".55" stop-color="#e8849a"/><stop offset="1" stop-color="#c95a74"/>
    </radialGradient>
    <radialGradient id="g-red" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ff8a8a"/><stop offset=".55" stop-color="#e2263b"/><stop offset="1" stop-color="#a3101f"/>
    </radialGradient>
    <radialGradient id="g-lilac" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#b9a9f0"/><stop offset=".55" stop-color="#6f56c4"/><stop offset="1" stop-color="#4b3596"/>
    </radialGradient>
    <path id="heart-path" d="M12 21.5C5 16.5 1 12.6 1 7.6 1 4 3.8 1.2 7.2 1.2c2 0 3.8 1 4.8 2.6 1-1.6 2.8-2.6 4.8-2.6C20.2 1.2 23 4 23 7.6c0 5-4 8.9-11 13.9z"/>
  </defs>
  <symbol id="heart-pink" viewBox="0 0 24 22">
    <use href="#heart-path" fill="url(#g-pink)"/>
    <ellipse cx="7.2" cy="6.2" rx="2.6" ry="1.5" fill="#fff" opacity=".55" transform="rotate(-35 7.2 6.2)"/>
  </symbol>
  <symbol id="heart-red" viewBox="0 0 24 22">
    <use href="#heart-path" fill="url(#g-red)"/>
    <ellipse cx="7.2" cy="6.2" rx="2.6" ry="1.5" fill="#fff" opacity=".55" transform="rotate(-35 7.2 6.2)"/>
  </symbol>
  <symbol id="heart-lilac" viewBox="0 0 24 22">
    <use href="#heart-path" fill="url(#g-lilac)"/>
    <ellipse cx="7.2" cy="6.2" rx="2.6" ry="1.5" fill="#fff" opacity=".45" transform="rotate(-35 7.2 6.2)"/>
  </symbol>
</svg>

<canvas id="confetti"></canvas>

<div class="stage" id="stage">
<img class="princess" src="thiep-assets/princess.webp" alt="Công chúa">
<img class="stk tl" src="thiep-assets/couple-07.webp" alt="">
<img class="stk tr" src="thiep-assets/couple-09.webp" alt="">
<img class="stk bl" src="thiep-assets/couple-05.webp" alt="">
<img class="stk br" src="thiep-assets/couple-06.webp" alt="">
<main class="board" id="card">
  <h1 class="piped" aria-label="Happy birthday my love">
    <span class="w">Happy</span> <span class="w">birthday</span>
    <span class="my"><i class="dot"></i><span class="w">my</span> <svg class="ph"><use href="#heart-pink"/></svg><i class="dot"></i></span>
  </h1>

  <p class="invite">Lời mời tham dự buổi sinh nhật</p>

  <ol class="plan">
    <li>
      <time>19:00</time>
      <span><b>Xuất phát</b></span>
    </li>
    <li>
      <time>19:40</time>
      <span><b>Chụp ảnh ở Tack Tack Booth</b><a href="https://www.google.com/maps/search/?api=1&query=69%20Tr%C3%A0ng%20Thi%2C%20Ho%C3%A0n%20Ki%E1%BA%BFm%2C%20H%C3%A0%20N%E1%BB%99i" target="_blank" rel="noopener">📍 69 Tràng Thi, Hoàn Kiếm</a></span>
    </li>
    <li>
      <time>20:45</time>
      <span><b>Buffet nướng Ăndeee</b><a href="https://www.google.com/maps/search/?api=1&query=L%E1%BA%A9u%20N%C6%B0%E1%BB%9Bng%20%C4%82ndeee%2066B%20Tri%E1%BB%81u%20Kh%C3%BAc" target="_blank" rel="noopener">📍 Ngõ 66B Triều Khúc</a></span>
    </li>
    <li>
      <time>22:25</time>
      <span><b>Về nhà</b></span>
    </li>
  </ol>
</main>
</div>

<script>
  const colors = ['#e7899b', '#f8c3cd', '#c9607a', '#8b7fd1', '#b9a9f0', '#ffffff'];
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const card = document.getElementById('card');
  const stage = document.getElementById('stage');

  // Split the title into letters so they appear one by one, like icing being piped.
  let order = 0;
  document.querySelectorAll('h1 .w').forEach(word => {
    word.innerHTML = [...word.textContent]
      .map(ch => `<span class="ch" style="animation-delay:${0.5 + order++ * 0.06}s">${ch}</span>`)
      .join('');
  });

  // Shrink the stage on short screens so the page never scrolls.
  function fitCard() {
    stage.style.zoom = '1';
    const room = innerHeight - 24;
    stage.style.zoom = String(Math.min(1, room / stage.offsetHeight));
  }
  addEventListener('resize', fitCard);
  document.fonts.ready.then(fitCard);
  fitCard();

  card.addEventListener('click', e => {
    if (e.target.closest('a') || reducedMotion) return;
    burstConfetti(e.clientX, e.clientY);
  });
  if (!reducedMotion) setTimeout(() => burstConfetti(innerWidth / 2, innerHeight / 3), 1700);

  function burstConfetti(x, y) {
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    const pieces = Array.from({length: 120}, () => ({
      x, y,
      vx: (Math.random() - 0.5) * 14,
      vy: -Math.random() * 14 - 4,
      size: 5 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      spin: Math.random() * Math.PI
    }));
    let frame = 0;
    const draw = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.vy += 0.4;
        p.x += p.vx;
        p.y += p.vy;
        p.spin += 0.2;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.spin);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        ctx.restore();
      });
      if (++frame < 150) requestAnimationFrame(draw);
      else ctx.clearRect(0, 0, canvas.width, canvas.height);
    };
    draw();
  }
</script>
</body>
</html>
